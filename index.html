<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo-Focused Blog</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #f0f0f5;
      color: #333;
    }

    header {
      background-color: #1e1e2f;
      color: white;
      padding: 2rem;
      text-align: center;
    }

    header h1 {
      font-size: 2.5rem;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 2rem;
      max-width: 1200px;
      margin: auto;
    }

    .photo-card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      transition: transform 0.2s;
    }

    .photo-card:hover {
      transform: translateY(-5px);
    }

    .photo-card img {
      width: 100%;
      height: 250px;
      object-fit: cover;
    }

    .photo-caption {
      padding: 1rem;
      font-size: 1rem;
    }

    footer {
      background-color: #1e1e2f;
      color: white;
      text-align: center;
      padding: 1rem;
      margin-top: 2rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>My Photo Blog</h1>
    <p>Exploring the world one photo at a time</p>
  </header>

  <section class="gallery">
    <div class="photo-card">
      <img src="https://via.placeholder.com/400x250?text=Beach+Sunset" alt="Beach Sunset">
      <div class="photo-caption">A golden sunset over a quiet beach.</div>
    </div>

    <div class="photo-card">
      <img src="https://via.placeholder.com/400x250?text=Mountain+Hike" alt="Mountain Hike">
      <div class="photo-caption">Reaching new heights on the trail.</div>
    </div>

    <div class="photo-card">
      <img src="https://via.placeholder.com/400x250?text=City+Lights" alt="City Lights">
      <div class="photo-caption">The city comes alive after dark.</div>
    </div>

    <div class="photo-card">
      <img src="https://via.placeholder.com/400x250?text=Forest+Path" alt="Forest Path">
      <div class="photo-caption">A quiet walk through the woods.</div>
    </div>
  </section>

  <footer>
    <p>&copy; 2025 My Photo Blog. All rights reserved.</p>
  </footer>
</body>
</html>
